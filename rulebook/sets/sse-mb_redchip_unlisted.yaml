  shared_clauses:
  - clause_id: rc_unlisted_g2_c1
    law_ref: sse_main_2026#3.1.5
    logic: all
    display: 预计市值不低于100亿元（两支路公共）
    leaves:
    - leaf_id: rc_unlisted_g2_c1_l1
      item_ref: mktcap_forecast
      op: ge
      threshold:
        value: 10000000000.0
        format: number
  - clause_id: rc_unlisted_g2_c2
    law_ref: sse_main_2026#3.1.5
    logic: all
    display: 自主研发、国际领先技术，同行业相对优势（两支路公共）
    leaves:
    - leaf_id: rc_unlisted_g2_c2_l1
      item_ref: self_developed_tech
      op: eq
      threshold:
        value: true
        format: boolean
  branches:
  - set_id: cn_main_redchip_unlisted_g2-b1
    display: null
    aliases:
      midas:
      - IPO-08
    clauses:
    - clause_id: rc_unlisted_g2_b1_c1
      law_ref: sse_main_2026#3.1.5
      logic: all
      display: 营收快速增长·路径A：最近一年营收≥5亿
      exemptions:
      - when:
          profile_field: company_stage
          in_list:
          - rd_stage
          - strategic_significance
        excludes:
        - rev_latest
        note: 处于研发阶段的红筹企业和对国家创新驱动发展战略有重要意义的红筹企业，不适用“营业收入快速增长”的上述要求（3.1.5 / 2.1.3 末句，四部法规逐字在文）
      leaves:
      - leaf_id: rc_unlisted_g2_b1_c1_l1
        item_ref: rev_latest
        op: ge
        threshold:
          value: 500000000.0
          format: number
    - clause_id: rc_unlisted_g2_b1_c2
      law_ref: sse_main_2026#3.1.5
      logic: all
      display: 营收快速增长·路径A：3年复合增长率10%以上
      exemptions:
      - when:
          profile_field: company_stage
          in_list:
          - rd_stage
          - strategic_significance
        excludes:
        - rev_3y_cagr
        note: 处于研发阶段的红筹企业和对国家创新驱动发展战略有重要意义的红筹企业，不适用“营业收入快速增长”的上述要求（3.1.5 / 2.1.3 末句，四部法规逐字在文）
      leaves:
      - leaf_id: rc_unlisted_g2_b1_c2_l1
        item_ref: rev_3y_cagr
        op: ge
        threshold:
          value: 0.1
          format: percent
