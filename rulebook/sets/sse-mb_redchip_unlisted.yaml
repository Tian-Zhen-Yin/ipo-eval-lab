    - clause_id: rc_unlisted_g2_b2_c2
      law_ref: sse_main_2026#3.1.5
      logic: all
      display: 营收快速增长·路径B：3年复合增长率20%以上
      exemptions:
      - when:
          profile_field: company_stage
