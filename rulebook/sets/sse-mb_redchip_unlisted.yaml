# 正式规则库（由签核记录导出，勿手工编辑）
# 来源：candidates_bridged.jsonl + signoff-records.jsonl
# ADR-0005 R3：正式库只能由人工签核产生——本文件只含已签核条款
- scope: set
  group_id: cn_main_redchip_unlisted_g1
  display: redchip_unlisted 标准 1
  boards:
  - SSE-MB
  - SZSE-MB
  company_type: redchip_unlisted
  group_no: 1
  section: null
  effective_from: '2026-04-30'
  law_refs:
  - sse_main_2026#3.1.5
  shared_clauses: []
  branches:
  - set_id: cn_main_redchip_unlisted_g1-b1
    display: null
    aliases:
      midas:
      - IPO-07
    clauses:
    - clause_id: rc_unlisted_g1_b1_c1
      law_ref: sse_main_2026#3.1.5
      logic: all
      display: 预计市值不低于200亿元
      leaves:
      - leaf_id: rc_unlisted_g1_b1_c1_l1
        item_ref: mktcap_forecast
        op: ge
        threshold:
          value: 20000000000.0
          format: number
    - clause_id: rc_unlisted_g1_b1_c2
      law_ref: sse_main_2026#3.1.5
      logic: all
      display: 最近一年营业收入不低于30亿元
      leaves:
      - leaf_id: rc_unlisted_g1_b1_c2_l1
        item_ref: rev_latest
        op: ge
        threshold:
          value: 3000000000.0
          format: number
- scope: set
