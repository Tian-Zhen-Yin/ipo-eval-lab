  - set_id: cn_main_redchip_unlisted_g2-b3
    display: null
    aliases:
      midas:
      - IPO-10
    clauses:
    - clause_id: rc_unlisted_g2_b3_c1
      law_ref: sse_main_2026#3.1.5
      logic: all
      display: 营收快速增长·路径C：行业下行期，3年复合增长率高于同行业可比公司同期平均
