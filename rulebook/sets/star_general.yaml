# 样板套 1（步骤 2 验证件 A：group 内 branch 择一）
# 科创板·一般企业·第一套；快照 IPO-15 / IPO-16 两行 = 两个 branch（calibration/0001 §1）
- scope: set
  group_id: star_general_g1
  display: 科创板标准一（市值＋净利润）
  boards: [STAR]
  company_type: general
  group_no: 1
  effective_from: 2019-03-01        # 待校准 #5 回填准确生效日
  law_refs: [sse_star_2026#2.1.2]
  shared_clauses:                   # 不变量 #6：公共条文写一次
    - clause_id: star_g1_c0
      display: 预计市值不低于10亿元
      law_ref: sse_star_2026#2.1.2(一)
      leaves:
        - leaf_id: star_g1_c0_l1
          item_ref: mktcap_forecast
          op: ge
          threshold: {value: 1000000000, format: number}
  branches:
    - set_id: star_general_g1-b1
      display: 两年净利润路径
      aliases: {midas: [IPO-15]}
      clauses:
        - clause_id: star_g1_b1_c1
          display: 最近两年净利润均为正
          law_ref: sse_star_2026#2.1.2(一)
          leaves:
            - leaf_id: star_g1_b1_c1_l1
              item_ref: np_2y_allpos
              op: gt
              threshold: {value: 0, format: number}
        - clause_id: star_g1_b1_c2
          display: 最近两年净利润累计不低于5000万元
          law_ref: sse_star_2026#2.1.2(一)
          leaves:
            - leaf_id: star_g1_b1_c2_l1
              item_ref: np_2y_sum
              op: ge
              threshold: {value: 50000000, format: number}
    - set_id: star_general_g1-b2
      display: 一年净利润＋营业收入路径
      aliases: {midas: [IPO-16]}
      clauses:
        - clause_id: star_g1_b2_c1
          display: 最近一年净利润为正
          law_ref: sse_star_2026#2.1.2(一)
          leaves:
            - leaf_id: star_g1_b2_c1_l1
              item_ref: np_latest
              op: gt
              threshold: {value: 0, format: number}
        - clause_id: star_g1_b2_c2
          display: 最近一年营业收入不低于1亿元
          law_ref: sse_star_2026#2.1.2(一)
          leaves:
            - leaf_id: star_g1_b2_c2_l1
              item_ref: rev_latest
              op: ge
              threshold: {value: 100000000, format: number}
