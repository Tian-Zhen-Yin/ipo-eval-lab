# 条件型库（设计 0002 §2.3；P1：24 种条文条件型 → 26 个原子 item）
# - 「3年均正且累计」在条文中是一个句式，此处拆为 allpos + sum 两个 item（ADR-0003：两个量词）
# - 扣非成对叶被 measures(lower_of_both) 吸收：check08+check13 四变一（如 np_latest）
# - 段②/段① 专用条件型（研发人员占比、发明专利、经营年限、股本、发行比例等）随 positioning/issuance 铺开时补（步骤 4）
# item = 可复用条件类型（量词+窗口+指标），不带阈值；阈值在 leaf。

# ── 市值类（adjust：由发行/定价决策决定，非经营趋势）──
- item_id: mktcap_forecast
  display: 预计市值
  nature: documentary
  basis: worksheet
  metric_ref: mktcap
  lever: adjust
  aliases: {midas: [check01]}
  note: '「市值/预计市值(3)」快照条件型的归属由校准问题 #5 裁定，暂记于此'

- item_id: mktcap_actual
  display: 市值（红筹已境外上市）
  nature: documentary
  basis: worksheet
  metric_ref: mktcap
  lever: adjust
  aliases: {midas: []}
  note: 境外二级市场事实值；mock 无数据源 → indeterminate（G-C）

# ── 营收类（grow → driver: operating_revenues）──
- item_id: rev_latest
  display: 最近1年营业收入
  nature: quantitative
  basis: calc
  metric_ref: operating_revenues
  quantifier: latest
  window: {kind: latest}
  lever: grow
  driver_ids: [operating_revenues]
  aliases: {midas: [check02]}

- item_id: rev_2y_avg
  display: 最近2年营业收入平均值
  nature: quantitative
  basis: calc
  metric_ref: operating_revenues
  quantifier: avg
  window: {kind: last_n_years, n: 2}
  lever: grow
  driver_ids: [operating_revenues]
  aliases: {midas: [check03]}

- item_id: rev_3y_sum
  display: 最近3年营业收入累计
  nature: quantitative
  basis: calc
  metric_ref: operating_revenues
  quantifier: sum
  window: {kind: last_n_years, n: 3}
  lever: grow
  driver_ids: [operating_revenues]
  aliases: {midas: [check04]}

- item_id: rev_1y_growth
  display: 最近1年营业收入增长率
  nature: quantitative
  basis: calc
  metric_ref: operating_revenues   # 取数口径=营收金额；cagr 量词把金额算成增长率
  quantifier: cagr          # 2 年窗口的 CAGR ≡ 同比增长率（幂次 1/(2-1)=1）
  window: {kind: last_n_years, n: 2}
  lever: grow
  driver_ids: [operating_revenues]
  aliases: {midas: [check05]}

- item_id: rev_3y_cagr
  display: 最近3年营业收入复合增长率
  nature: quantitative
  basis: calc
  metric_ref: operating_revenues   # 同上：金额指标 + cagr 量词 → percent 阈值
  quantifier: cagr
  window: {kind: last_n_years, n: 3}
  lever: grow
  driver_ids: [operating_revenues]
  aliases: {midas: [check06]}

