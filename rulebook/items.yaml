# ── 比率类（derived：分子分母各自变化，不直接外推）──
- item_id: rd_intensity_2y
  display: 最近2年累计研发投入占最近2年累计营业收入比例
  nature: quantitative
  basis: calc
  quantifier: ratio               # ratio 项不挂 metric_ref：量纲=percent（比率约定），分子分母见下
  window: {kind: last_n_years, n: 2}
  numerator: rd_investment_total
  denominator: operating_revenues # 分母≤0 → indeterminate（五态，不判 not_met）
  lever: derived
  driver_ids: [rd_investment_total, operating_revenues]
  aliases: {midas: [check29]}

- item_id: rd_intensity_3y
  display: 最近3年累计研发投入占最近3年累计营业收入比例
  nature: quantitative
  basis: calc
  quantifier: ratio
  window: {kind: last_n_years, n: 3}
  numerator: rd_investment_total
  denominator: operating_revenues
  lever: derived
  driver_ids: [rd_investment_total, operating_revenues]
  aliases: {midas: [check30]}

