  note: '红筹未上市/科创板/创业板红筹定性形态（3.1.5、2.1.3 无「科技创新能力较强」）。batch2 L2 拦截后与 3.1.4 增强形态拆分（2026-11-12），见 self_developed_tech_full'

- item_id: self_developed_tech_full
