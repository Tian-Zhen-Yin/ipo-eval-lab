extraction_config:
  # 切分器实测配置（extract.py 2026-11-11 版）
  article_pattern: 点分式行首条款号（X.Y / X.Y.Z），定义形态条款号后直接跟正文；
    引用形态条款号后紧跟「条」字（正文断行把「第」切到上行末），判别为引用不切分
  page_num_pattern: 独立数字行全行过滤（'11 ' / '— 11 —' / '- 11 -'）
  toc_filter: 含 4+ 半角引导点的行整行丢弃
  normalization: 合并硬换行为连续文本；substring 锚点 = 规范化 text 本身
  integrity_check: 条款号连续性（同前缀序号 +1），跳号/回退即告警
  confidence_default: high
  pending:
    - 向量兜底（异常文档形态 + 沪深同文归并 cross_board_equivalents）v2
    - 精确施行日人工核对（修订月 ≠ 施行日）
    - 上交所 docx 副本与 PDF 的一致性未校验
