- law_id: szse_chinext_recommend
  title: 深圳证券交易所创业板企业发行上市申报及推荐暂行规定（2024年修订）
  source_type: exchange_rule
  effective_from: '2024-04-30'
  articles:
  - article: 第一条
    text: 为了引导、规范创业板发行人申报和保荐人推荐工作，促进创业板市场持续健康发展，根据中国证券监督管理委员会及深圳证券交易所（以下简称本所）关于首次公开发行股票等有关规定，制定本规定。
  - article: 第二条
    text: 创业板定位于深入贯彻创新驱动发展战略，适应发展更多依靠创新、创造、创意的大趋势，主要服务成长型创新创业企业，并支持传统产业与新技术、新产业、新业态、新模式深度融合。
  - article: 第三条
    text: 保荐人应当顺应国家经济发展战略和产业政策导向、新发展理念，准确把握创业板定位，切实履行勤勉尽责义务，推荐能够通过创新、创造、创意促进新质生产力发展且符合下列情形之一的企业申报在创业板发行上市：（一）能够依靠创新、创造、创意促进企业摆脱传统经济增长方式和生产力发展路径，促进科技成果高水平应用、生产要素创新性配置、产业深度转型升级、新动能发展壮大的成长型创新创业企业；（二）能够通过创新、创造、创意促进互联网、大数据、云计算、自动化、人工智能、新能源等新技术、新产业、新业态、新模式与传统产业深度融合，推动行业向高端化、智能化、绿色化发展的企业。本所在发行上市审核中，对按照前款规定申报的发行人符合创新、创造、创意发展趋势，与新技术、新产业、新业态、新模式深度融合的情况予以重点关注，并可以根据需要向本所行业咨询专家库的专家进行咨询。
  - article: 第四条
    text: 本所支持和鼓励符合下列标准之一的成长型创新创业企业申报在创业板发行上市：（一）最近三年研发投入复合增长率不低于15%，最近一年投入金额不低于1000万元，且最近三年营业收入复合增长率不低于25%；（二）最近三年累计研发投入金额不低于5000万元，且最近三年营业收入复合增长率不低于25%；（三）属于制造业优化升级、现代服务业或者数字经济等现代产业体系领域，且最近三年营业收入复合增长率不低于30%。最近一年营业收入金额达到3亿元的企业，或者按照《关于开展创新企业境内发行股票或存托凭证试点的若干意见》等相关规则申报创业板的已境外上市红筹企业，不适用前款规定的营业收入复合增长率要求。
  - article: 第五条
    text: 属于上市公司行业分类相关规定中下列行业的企业，原则上不支持其申报在创业板发行上市，但与互联网、大数据、云计算、自动化、人工智能、新能源等新技术、新产业、新业态、新模式深度融合的创新创业企业除外：（一）农林牧渔业；（二）采矿业；（三）酒、饮料和精制茶制造业；（四）纺织业；（五）黑色金属冶炼和压延加工业；（六）电力、热力、燃气及水生产和供应业；（七）建筑业；（八）交通运输、仓储和邮政业；（九）住宿和餐饮业；（十）金融业；（十一）房地产业；（十二）居民服务、修理和其他服务业。禁止产能过剩行业、《产业结构调整指导目录》中的淘汰类行业，以及从事学前教育、学科类培训、类金融业务的企业在创业板发行上市。
  - article: 第六条
    text: 发行人申报时，应当按照本规定所附示范格式的要求，提交关于符合创业板定位要求的专项说明。专项说明应当突出重点、直接明了，有针对性地评估发行人是否符合创业板定位要求。
  - article: 第七条
    text: 发行人应当在招股说明书中就本规定第二条、第三条、第四条和第五条规定的创业板支持方向、行业领域、成长型创新创业企业指标或者相关情形进行相应的信息披露。
  - article: 第八条
    text: 保荐人应当围绕创业板定位和本规定第三条要求，对发行人自我评估中涉及的事项进行尽职调查，重点对发行人认定属于成长型创新创业企业的判断依据是否真实、客观、合理，以及申请文件中的相关信息披露情况进行核查把关，并按照本规定所附示范格式的要求，出具专项意见。专项意见中应说明具体的核查内容、核查过程等，同时在上市保荐书中说明核查结论及依据。保荐人核查时，应当按照实质重于形式的原则，对发行人是否符合创业板定位进行综合判断，避免简单根据相关数量指标、发行人业务涉及互联网与传统产业简单结合等情形得出发行人符合创业板定位的结论。
  - article: 第九条
    text: 发行人及其保荐人可以在申报前，就本规定相关条款的理解和适用，向本所进行咨询。
  - article: 第十条
    text: 本所可以根据国家经济发展战略、产业政策导向和创业板发展需要，对本规定第五条规定的行业进行调整。
  - article: 第十一条
    text: 本规定由本所负责解释。
  - article: 第十二条
    text: 本规定自发布之日起施行。本所于2022年12月30日发布的《深圳证券交易所创业板企业发行上市申报及推荐暂行规定（2022年修订）》（深证上〔2022〕1219号）同时废止。附件1-1关于符合创业板定位要求的专项说明（参考示范格式）深圳证券交易所：根据中国证券监督管理委员会及深圳证券交易所关于首次公开发行股票的规定及《深圳证券交易所创业板企业发行上市申报及推荐暂行规定（2024年修订）》等有关规定，我公司对是否符合创业板定位进行了充分的自我评估，出具本专项说明，并保证本专项说明真实、准确和完整。一、公司简介与主营业务概述二、公司符合创业板定位的说明（一）公司符合创业板定位相关指标要求创业板定位相关指标一是否符合指标情况□是□否□是□否□是□否□是□否创业板定位相关指标二是否符合指标情况□是□否□是□否□是□否□是□否创业板定位相关指标三是否符合主要依据□是□否□是□否□是□否□是□否（公司可选择创业板定位相关指标一、指标二或者指标三进行说明。）（二）公司关于符合创业板定位的具体说明公司应当结合自身和行业科技创新实际情况，客观准确地对自身符合创业板定位的情况进行说明，具体包括但不限于以下内容：1.公司能够通过创新、创造、创意促进新质生产力发展的情况公司符合下列情形之一的表征及具体依据：（1）能够依靠创新、创造、创意促进企业摆脱传统经济增长方式和生产力发展路径，促进科技成果高水平应用、生产要素创新性配置、产业深度转型升级、新动能发展壮大的成长型创新创业企业；（2）能够通过创新、创造、创意促进互联网、大数据、云计算、自动化、人工智能、新能源等新技术、新产业、新业态、新模式与传统产业深度融合，推动行业向高端化、智能化、绿色化发展的企业。2.公司的技术创新性及其表征（如适用）。公司根据研发的技术及其功能性能、取得的研发进展及其成果、获得的专业资质和重要奖项等，详细说明拥有和应用的技术及其先进性，公司是否具备较强的创新能力。3.公司属于现代产业体系及其表征（如适用）。公司是否具备进一步研发、深度利用相关技术及模式的能力，且上述能力是否具备可持续性；涉及现代产业体系领域的产品、服务是否属于公司的核心产品及服务；公司是否具备较强的创新能力。4.公司的成长性及其表征。公司应当结合自身产品市场空间，报告期内公司收入、利润变动情况，公司成长性特征是否来源于其核心技术或产品，公司创新能力是否能够支撑成长性等，详细说明其成长性情况及是否可持续。5.公司符合创业板行业领域及其依据。公司应当说明所属行业是否属于《深圳证券交易所创业板企业发行上市申报及推荐暂行规定（2024年修订）》第五条规定的原则上不支持其申报在创业板发行上市或禁止类行业；公司选择所属行业分类的依据，公司行业分类是否准确、是否存在所属行业分类变动的可能；公司是否主要依赖国家限制产业开展业务。6.公司符合创业板定位相关指标及其依据。公司根据所选择的相关具体指标，说明符合该项指标的具体情况、计算基础和计算方法。（三）公司认为需要说明的其他情况（如有）三、结论性意见经充分评估，发行人认为自身符合创业板定位要求。××股份有限公司年月日附件1-2关于发行人符合创业板定位要求的专项意见（参考示范格式）深圳证券交易所：根据中国证券监督管理委员会及深圳证券交易所关于首次公开发行股票的规定及《深圳证券交易所创业板企业发行上市申报及推荐暂行规定（2024年修订）》等有关规定，××保荐人及指定的保荐代表人已经勤勉尽责，诚实守信，严格按照相关业务规则、行业执业规范和道德准则，对××发行人是否符合创业板定位进行了充分的核查论证工作，出具本专项意见，并保证所出具意见真实、准确和完整。一、发行人简介与主营业务概述二、保荐人关于发行人符合创业板定位的核查情况（一）发行人能够通过创新、创造、创意促进新质生产力发展的核查情况保荐人应对发行人是否符合下列情形之一发表核查意见：1.能够依靠创新、创造、创意促进企业摆脱传统经济增长方式和生产力发展路径，促进科技成果高水平应用、生产要素创新性配置、产业深度转型升级、新动能发展壮大的成长型创新创业企业；2.能够通过创新、创造、创意促进互联网、大数据、云计算、自动化、人工智能、新能源等新技术、新产业、新业态、新模式与传统产业深度融合，推动行业向高端化、智能化、绿色化发展的企业。（二）发行人技术创新性的核查情况（如适用）保荐人应对发行人研发的技术及其功能性能、取得的研发进展及其成果、获得的专业资质和主要奖项等进行核查，并就发行人拥有和应用的技术及其先进性，发行人是否具备较强的创新能力发表核查意见。（三）发行人属于现代产业体系的核查情况（如适用）保荐人应对发行人是否具备进一步研发、深度利用相关技术及模式的能力，上述能力是否具备可持续性；涉及现代产业体系领域的产品、服务是否属于发行人的核心产品及服务，发行人是否具备较强的创新能力发表核查意见。（四）发行人成长性的核查情况保荐人应对发行人所处市场空间的表述是否准确，报告期内发行人收入、利润变动情况是否符合成长性特征，发行人成长性是否来源于其核心技术或产品，发行人创新能力是否能够支撑其成长，发行人成长性是否可持续等发表核查意见。（五）发行人符合创业板行业领域的核查情况保荐人应根据上市公司行业分类相关规则，核查发行人所属行业是否属于《深圳证券交易所创业板企业发行上市申报及推荐暂行规定（2024年修订）》第五条规定的原则上不支持其申报在创业板发行上市的行业或禁止类行业，说明理由和依据，并就发行人主营业务与所属行业归类是否匹配，与可比公司行业领域归类是否存在显著差异，发行人是否主要依赖国家限制产业开展业务等发表核查意见。（六）发行人符合创业板定位相关指标的核查情况保荐人应对报告期内发行人的研发投入归集、营业收入的确认及增长、是否属于现代产业体系领域等情况进行核查，并就发行人是否符合成长型创新创业企业相关指标发表核查意见。（七）保荐人认为需要说明的其他情况（如有）三、关于发行人符合创业板定位的结论性意见经充分核查和综合判断，本保荐人认为发行人出具的专项说明和披露的成长型创新创业企业信息真实、准确、完整，发行人符合创业板定位要求。××保荐人年月日
