    - article: "2.1.2"
      text: （简述）发行人申请股票上市，市值及财务指标应当至少符合下列各项标准之一：（一）预计市值不低于10亿元，最近两年净利润均为正且累计净利润不低于5000万元，或者预计市值不低于10亿元，最近一年净利润为正且营业收入不低于1亿元；……
