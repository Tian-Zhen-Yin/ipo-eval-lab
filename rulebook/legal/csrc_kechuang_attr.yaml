- law_id: csrc_kechuang_attr
  title: 科创属性评价指引（试行）
  source_type: law
  effective_from: '2024-04-30'
  articles:
  - article: 二、
    text: 支持和鼓励科创板定位规定的相关行业领域中，虽未达到前述指标，但符合下列情形之一的企业申报科创板上市：（1）发行人拥有的核心技术经国家主管部门认定具有国际领先、引领作用或者对于国家战略具有重大意义；（2）发行人作为主要参与单位或者发行人的核心技术人员作为主要参与人员，获得国家科技进步奖、国家自然科学奖、国家技术发明奖，并将相关技术运用于公司主营业务；（3）发行人独立或者牵头承担与主营业务和核心技术相关的国家重大科技专项项目；（4）发行人依靠核心技术形成的主要产品（服务），属于国家鼓励、支持和推动的关键设备、关键产品、关键零部件、关键材料等，并实现了进口替代；（5）形成核心技术和应用于主营业务，并能够产业化的发明专利（含国防专利）合计50项以上。
  - article: 三、
    text: 限制金融科技、模式创新企业在科创板上市。禁止房地产和主要从事金融、投资类业务的企业在科创板上市。
  - article: 四、
    text: 上海证券交易所就落实本指引制定具体业务规则。
  calibration_pending: false
