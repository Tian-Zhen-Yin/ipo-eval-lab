- law_id: sse_star_recommend
  title: 上海证券交易所科创板企业发行上市申报及推荐暂行规定（2024年4月修订）
  source_type: exchange_rule
  effective_from: '2024-04-30'
  articles:
  - article: 第一条
    text: 为了进一步明确科创板定位把握标准，支持和鼓励硬科技企业在科创板发行上市，引导和规范发行人申报和保荐机构推荐工作，促进科创板市场持续健康发展，根据《关于在上海证券交易所设立科创板并试点注册制的实施意见》《首次公开发行股票注册管理办法》《科创属性评价指引（试行）》（以下简称《指引》）《上海证券交易所股票发行上市审核规则》和《上海证券交易所科创板股票上市规则》（以下简称《科创板上市规则》），制定本规定。
  - article: 第二条
    text: 科创板企业发行上市申报和推荐，应当基于《指引》和本规定中的科创属性要求，把握发行人是否符合科创板定位。发行人申报科创板发行上市的，应当对照《指引》和本规定中的科创属性要求，对其是否符合科创板定位进行自我评估。保荐机构推荐发行人申报科创板发行上市的，应当对发行人是否符合与科创板定位相关的科创属性要求，进行核查把关，作出专业判断。
  - article: 第三条
    text: 科创板面向世界科技前沿、面向经济主战场、面向国家重大需求，主要服务于符合国家战略，拥有关键核心技术，科技创新能力突出，主要依靠核心技术开展生产经营，行业地位突出或者市场认可度高，具有较强成长性的企业。
  - article: 第四条
    text: 保荐机构应当顺应国家战略和产业政策导向，立足促进新质生产力发展，贯彻高质量发展理念，准确把握科创板定位，推荐拥有关键核心技术，科技创新能力突出，科研成果转化运用能力突出，行业地位突出或者市场认可度高，具有较强成长性的“硬科技”企业申报科创板。
  - article: 第五条
    text: 申报科创板发行上市的发行人，应当属于下列行业领域的高新技术产业和战略性新兴产业：（一）新一代信息技术领域，主要包括半导体和集成电路、电子信息、下一代信息网络、人工智能、大数据、云计算、软件、互联网、物联网和智能硬件等；（二）高端装备领域，主要包括智能制造、航空航天、先进轨道交通、海洋工程装备及相关服务等；（三）新材料领域，主要包括先进钢铁材料、先进有色金属材料、先进石化化工新材料、先进无机非金属材料、高性能复合材料、前沿新材料及相关服务等；（四）新能源领域，主要包括先进核电、大型风电、高效光电光热、高效储能及相关服务等；（五）节能环保领域，主要包括高效节能产品及设备、先进环保技术装备、先进环保产品、资源循环利用、新能源汽车整车、新能源汽车关键零部件、动力电池及相关服务等；（六）生物医药领域，主要包括生物制品、高端化学药、高端医疗设备与器械及相关服务等；（七）符合科创板定位的其他领域。限制金融科技、模式创新企业在科创板发行上市。禁止房地产和主要从事金融、投资类业务的企业在科创板发行上市。
  - article: 第六条
    text: 支持和鼓励科创板定位规定的相关行业领域中，同时符合下列4项指标的企业申报科创板发行上市：（一）最近三年研发投入占营业收入比例5%以上，或者最近三年研发投入金额累计在8000万元以上；（二）研发人员占当年员工总数的比例不低于10%；（三）应用于公司主营业务并能够产业化的发明专利7项以上；（四）最近三年营业收入复合增长率达到25%，或者最近一年营业收入金额达到3亿元。采用《科创板上市规则》第2.1.2条第一款第（五）项规定的上市标准申报科创板的企业，或按照《关于开展创新企业境内发行股票或存托凭证试点的若干意见》等相关规则申报科创板的已境外上市红筹企业，可不适用前款第（四）项指标的规定；软件行业不适用前款第（三）项指标的要求，但研发投入占比应在10%以上。
  - article: 第七条
    text: 支持和鼓励科创板定位规定的相关行业领域中，虽未达到本规定第六条指标，但符合下列情形之一的企业申报科创板发行上市：（一）拥有的核心技术经国家主管部门认定具有国际领先、引领作用或者对于国家战略具有重大意义；（二）作为主要参与单位或者核心技术人员作为主要参与人员，获得国家自然科学奖、国家科技进步奖、国家技术发明奖，并将相关技术运用于主营业务；（三）独立或者牵头承担与主营业务和核心技术相关的国家重大科技专项项目；（四）依靠核心技术形成的主要产品（服务），属于国家鼓励、支持和推动的关键设备、关键产品、关键零部件、关键材料等，并实现了进口替代；（五）形成核心技术和应用于主营业务，并能够产业化的发明专利（含国防专利）合计50项以上。
  - article: 第八条
    text: 发行人申报时，应当按照本规定所附示范格式的要求，提交关于符合科创板定位的专项说明。专项说明应当突出重点，直接明了，有针对性评估是否符合科创属性要求。
  - article: 第九条
    text: 保荐机构应当围绕科创板定位，对发行人自我评估涉及的相关事项进行尽职调查，重点对发行人科创属性认定的依据是否真实、客观、合理，以及申请文件中的相关信息披露进行核查把关，并按照本规定所附示范格式的要求，出具专项意见，说明具体的核查内容、核查过程等，同时在上市保荐书中说明核查结论及依据。保荐机构核查时，应当结合发行人的技术先进性等情况进行综合判断，不应简单根据相关数量指标得出发行人符合科创板定位的结论。适用本规定第五条第一款第（七）项的，保荐机构应当充分论证、审慎推荐。
  - article: 第十条
    text: 本所发行上市审核中，按照实质重于形式的原则，着重从以下方面关注发行人的自我评估是否客观，保荐机构的核查把关是否充分并作出综合判断：（一）发行人是否符合科创板支持方向；（二）发行人的行业领域是否属于《指引》和本规定所列行业领域；（三）发行人的科创属性是否符合《指引》和本规定所列相关指标或情形要求；（四）发行人是否具有突出的科技创新能力；（五）本所规定的其他要求。
  - article: 第十一条
    text: 本所可以就发行人的科创属性向科技创新咨询委员会进行咨询，参考咨询意见作出是否符合科创板定位的审核判断。
  - article: 第十二条
    text: 发行人应当在招股说明书中，就第三条至第七条规定的科创板支持方向、行业领域、科创属性指标或者相关情形进行相应的信息披露。
  - article: 第十三条
    text: 发行人拟披露的与科创板定位相关的信息属于国家秘密、商业秘密，披露后可能导致其违反国家有关保密法律法规或者严重损害公司利益的，发行人及其保荐机构可以向本所申请豁免披露。
  - article: 第十四条
    text: 发行人及其保荐机构可在申报前，就本规定相关条款的理解和适用，向本所进行咨询。
  - article: 第十五条
    text: 本所对保荐机构推荐企业到科创板上市的行为实施自律监管，对违反本规定的保荐机构可以按规定采取自律监管措施或者纪律处分。
  - article: 第十六条
    text: 本规定由本所负责解释。
  - article: 第十七条
    text: 本规定自发布之日起实施。本所于2022年12月30日发布的《上海证券交易所科创板企业发行上市申报及推荐暂行规定》（上证发〔2022〕171号根据2023年8月25日上证发〔2023〕138号《关于修改、废止部分业务规则和业务指南的通知》修正）同时废止。本所其他相关规定与本规定不一致的，以本规定为准。附件：1.关于发行人符合科创板定位要求的专项说明（参考示范格式）2.关于发行人符合科创板定位要求的专项意见（参考示范格式）
