# 黄金集：43 官方套结构期望（U6 校准夹具）
#
# 来源：docs/calibration/0001-set-inventory.md §1 归组总表（2026-11-10 已拍板）
# 语义：「套」= midas 官方套号（L3 对齐键 (board, company_type, group_no) 的锚），
#       不是条文「项」——红筹已上市两项是 2 套、表决权差异一款两行是 1 套。
# 支路数：
#   snapshot_branches = midas 快照行数（0001 归组后；仅参考）
#   expected_branches = 法条可编码支路数（缺口路径不计数，见 gaps）
# 覆盖标记：covered=true 的组合参与结构对拍；false 的留给后续批次（测试自动加严）。
# 「套」只列 expected_branches > 0 的；expected_branches=0 的套（豁免语义未编码）
# 不进 sets（否则套号集合对拍会因「少一个空套」误报），改记在 gaps。

golden_version: "0001@2026-11-10"
thresholds_source: "批次1+2+3 提取（已过 U8 样板对拍 + L2 异构判定 + L3 套级 midas 对拍）"

expectations:
  # ── 沪主板（9 套）──
  - board: SSE-MB
    company_type: general
    covered: true
    sets:
      1: {snapshot_branches: 2, expected_branches: 1}   # 择一收敛为 1 clause(logic=any)；快照 sort1/sort2 拆行
      2: {snapshot_branches: 1, expected_branches: 1}
      3: {snapshot_branches: 1, expected_branches: 1}
  - board: SSE-MB
    company_type: redchip_listed
    covered: true
    sets:
      1: {snapshot_branches: 1, expected_branches: 1}   # 2000亿
      2: {snapshot_branches: 1, expected_branches: 1}   # 200亿 + 技术优势
  - board: SSE-MB
    company_type: redchip_unlisted
    covered: true
    sets:
      1: {snapshot_branches: 1, expected_branches: 1}   # 200亿 + 营收30亿
      2: {snapshot_branches: 3, expected_branches: 2}   # 100亿；增长三认定，行业对比无 item（gap）
      3: {snapshot_branches: 2, expected_branches: 1}   # 50亿+营收5亿；路径B 与营收≥5亿互斥、行业对比无 item（gap）
    gaps: ["[已裁定 2026-11-12] 增长认定第三路径（行业下行期 cagr>同行平均）——新增item+第三支路（底稿0002问题三）", "[已裁定 2026-11-12] 研发阶段/国家战略红筹豁免——按ADR-0008编码为Clause.exemptions（底稿0002问题二）"]
  - board: SSE-MB
    company_type: weighted_voting
    covered: true
    sets:
      1: {snapshot_branches: 2, expected_branches: 2}   # 一条两款共享「净利为正」签名 → 1 套 2 支路

  # ── 深主板（9 套，与沪主板同文）──
  - board: SZSE-MB
    company_type: general
    covered: true
    sets:
      1: {snapshot_branches: 2, expected_branches: 1}
      2: {snapshot_branches: 1, expected_branches: 1}
      3: {snapshot_branches: 1, expected_branches: 1}
  - board: SZSE-MB
    company_type: redchip_listed
    covered: true
    sets:
      1: {snapshot_branches: 1, expected_branches: 1}
      2: {snapshot_branches: 1, expected_branches: 1}
  - board: SZSE-MB
    company_type: redchip_unlisted
    covered: true
    sets:
      1: {snapshot_branches: 1, expected_branches: 1}
      2: {snapshot_branches: 3, expected_branches: 2}
      3: {snapshot_branches: 2, expected_branches: 1}
  - board: SZSE-MB
    company_type: weighted_voting
    covered: true
    sets:
      1: {snapshot_branches: 2, expected_branches: 2}

  # ── 创业板 ──
  - board: ChiNext
    company_type: general
    covered: true
    sets:
      1: {snapshot_branches: 1, expected_branches: 1}
      2: {snapshot_branches: 1, expected_branches: 1}
      3: {snapshot_branches: 1, expected_branches: 1}
      4: {snapshot_branches: 2, expected_branches: 2}   # 官方即两条并行路径
  - board: ChiNext
    company_type: redchip_listed
    covered: false          # 原文无「已在境外上市」标准条款（仅 4.5.17 表决权差异），无法律锚点
    adjudication: removed   # 2026-11-12 裁定（底稿0002问题一）：midas 存量冗余，不进规则库
    sets:
      1: {snapshot_branches: 1, expected_branches: 1}
      2: {snapshot_branches: 1, expected_branches: 1}
  - board: ChiNext
    company_type: redchip_unlisted
    covered: true
    sets:
      1: {snapshot_branches: 3, expected_branches: 2}   # 100亿（3 支路：增长三认定）
      2: {snapshot_branches: 1, expected_branches: 1}   # 50亿 + 营收5亿
    gaps: ["[已裁定 2026-11-12] 套3 特殊红筹豁免（redchip_special，expected_branches=0）——按ADR-0008编码为Clause.exemptions（底稿0002问题二）",
           "[已裁定 2026-11-12] 增长认定第三路径（行业下行期 cagr>同行平均）——新增item+第三支路（底稿0002问题三）"]
  - board: ChiNext
    company_type: weighted_voting
    covered: true
    sets:
      1: {snapshot_branches: 2, expected_branches: 2}

  # ── 科创板 ──
  - board: STAR
    company_type: general
    covered: true
    sets:
      1: {snapshot_branches: 2, expected_branches: 2}   # 共享市值10亿 + 两路径
      2: {snapshot_branches: 1, expected_branches: 1}
      3: {snapshot_branches: 1, expected_branches: 1}
      4: {snapshot_branches: 1, expected_branches: 1}
      5: {snapshot_branches: 1, expected_branches: 1}
  - board: STAR
    company_type: redchip_listed
    covered: false          # 同创业板：原文无「已在境外上市」标准条款，无法律锚点
    adjudication: removed   # 2026-11-12 裁定（底稿0002问题一）：midas 存量冗余，不进规则库
    sets:
      1: {snapshot_branches: 1, expected_branches: 1}
      2: {snapshot_branches: 1, expected_branches: 1}
  - board: STAR
    company_type: redchip_unlisted
    covered: true
    sets:
      1: {snapshot_branches: 3, expected_branches: 2}   # 100亿
      2: {snapshot_branches: 1, expected_branches: 1}   # 50亿 + 营收5亿
    gaps: ["[已裁定 2026-11-12] 套3 特殊红筹豁免（redchip_special，expected_branches=0）——按ADR-0008编码为Clause.exemptions（底稿0002问题二）",
           "[已裁定 2026-11-12] 增长认定第三路径（行业下行期 cagr>同行平均）——新增item+第三支路（底稿0002问题三）"]
  - board: STAR
    company_type: weighted_voting
    covered: true
    sets:
      1: {snapshot_branches: 2, expected_branches: 2}

  # ── 北交所（仅一般企业）──
  - board: BSE
    company_type: general
    covered: true
    sets:
      1: {snapshot_branches: 2, expected_branches: 2}   # 共享市值2亿+净资产5000万 + 两路径
      2: {snapshot_branches: 1, expected_branches: 1}
      3: {snapshot_branches: 1, expected_branches: 1}
      4: {snapshot_branches: 1, expected_branches: 1}

# ── 实锤错误毒株（false-pass 必须为 0；来源 0001 §3 + calibration/0001）──
poison_cases:
  - name: 主板二套市值 350亿笔误（正确 50亿）
    base_clause: cn_main_g2_b1_c1
    poison: {threshold: 3.5e10, threshold_text: "50 亿元"}
    must_be_caught_by: "1b-2 threshold 与 threshold_text 归一化不一致"
  - name: 现金流阈值单位错 2.5（正确 2.5亿）
    base_clause: cn_main_g2_b1_c4
    poison: {threshold: 2.5, threshold_text: "2.5 亿元"}
    must_be_caught_by: "1b-2 数值不在引文归一化集合 / 阈值不一致"
  - name: 同 board 内 clause_id 重复（转写重复，禁 0-3）
    base_clause: cn_main_g1_c2
    poison: {duplicate: true}
    must_be_caught_by: "0-3 唯一性"
  - name: 引文编造
    base_clause: cn_main_g1_c1
    poison: {quote: "最近三个会计年度净利润均为负且累计不低于五百亿元"}
    must_be_caught_by: "1b-1 引文逐字命中"
