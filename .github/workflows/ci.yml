# CI：全量测试 + 规则库 strict 加载 + 法条库/原文库一致性（设计 0008 §工程细节）
#
# 三个门禁，任何一个红即失败：
# 1. pytest 全量（tests/，根目录；results/ 不入 git 不影响）
# 2. rulebook strict 加载（28 sets + 4 positioning + 4 issuance，0 错 0 警）
# 3. 法条库/原文库同步（scripts/build_legal_library.py --check）+
#    段②原文库同步（scripts/cut_positioning_sources.py --check）+
#    裁定补丁幂等（scripts/apply_adjudication_p5b.py 重跑 diff 为空）
#
# 环境口径与设计 0008 E1~E5 拍板一致：Python 3.10、不引入 uv、pytest 根目录 tests/。
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        # 运行期依赖只有 pydantic / pyyaml / pytest（+ pymupdf 仅切分脚本用，
        # CI 不跑切分、只跑 --check 一致性校验——但 --check 要读已生成的 YAML，
        # 不 import pymupdf，故不装亦可；装上保险，供未来 CI 跑切分）。
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2" "pyyaml>=6" "pytest>=8" "pymupdf>=1.24"

      - name: pytest 全量
        run: python -m pytest -q

      - name: 规则库 strict 加载
        run: |
          python -c "
          from pathlib import Path
          from ipo_eval_lab.rulebook import load_rulebook
          r = load_rulebook(Path('rulebook'), strict_global=True)
          n = sum(len(g.shared_clauses) + sum(len(b.clauses) for b in g.branches)
                  for g in r.rulebook.groups)
          assert not r.warnings, r.warnings
          print(f'OK: {len(r.rulebook.groups)} groups / {n} clauses / 0 warnings')
          "

      - name: 法条库与原文库一致
        run: python scripts/build_legal_library.py --check

      - name: 段② 原文库与源文件一致
        run: python scripts/cut_positioning_sources.py --check

      - name: 裁定补丁幂等（P5b）
        # 重跑生成器，产物必须与已提交版本逐字节一致——不一致 = 有人手改了
        # 生成物（候选库/正式库是签核导出产物，手改即破坏审计链）。
        run: |
          python scripts/apply_adjudication_p5b.py
          git diff --exit-code -- calibration/l1a/output/candidates_amended.jsonl \
            || (echo '候选库与生成器不一致：有人手改了 machine 产物' && exit 1)

      - name: 段② 候选幂等
        run: python scripts/build_positioning_candidates.py --check

      - name: 段① 候选幂等
        run: python scripts/build_issuance_candidates.py --check

      - name: L7 trace 对拍（三张守恒表）
        run: python scripts/trace_check.py --check