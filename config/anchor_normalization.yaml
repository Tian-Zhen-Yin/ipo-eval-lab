# R10 锚点归一化规则表（设计 0003 §4）
# 版本化配置：原文形态 → 归一化数值/算子
# 用途：L1b 数值锚点核对时，把引文与候选的数值统一到同一单位再比对

version: "1.0"
effective_from: "2026-11-11"

# ── 金额单位归一化 ──
amount_units:
  亿: 1.0e8
  亿元: 1.0e8
  亿港元: 1.0e8
  亿股: 1.0e8
  万元: 1.0e4
  万: 1.0e4
  元: 1.0
  千元: 1.0e3

# ── 中文数字映射 ──
chinese_numerals:
  零: 0
  一: 1
  二: 2
  两: 2
  三: 3
  四: 4
  五: 5
  六: 6
  七: 7
  八: 8
  九: 9
  十: 10
  百: 100
  千: 1000

# ── 复合中文数字（如"五十亿"）──
compound_numerals:
  "五十亿": 5.0e9
  "一百亿": 1.0e10
  "两百亿": 2.0e10
  "三十亿": 3.0e9
  "二十亿": 2.0e9
  "十亿": 1.0e9
  "五千万元": 5.0e7
  "三千万": 3.0e7

# ── 百分比归一化 ──
percent_forms:
  "百分之十五": 0.15
  "百分之十": 0.10
  "百分之二十": 0.20
  "百分之二十五": 0.25
  "百分之三十": 0.30

# ── 比较算子归一化 ──
operators:
  "不低于": "GE"
  "不少于": "GE"
  "不低于或等于": "GE"
  "高于": "GT"
  "超过": "GT"
  "大于": "GT"
  "逾": "GT"
  "不高于": "LE"
  "不超过": "LE"
  "不超过或等于": "LE"
  "低于": "LT"
  "小于": "LT"
  "等于": "EQ"
  "达到": "GE"
  "均为正": { "quantifier": "all_periods", "op": "GT", "threshold": 0 }
  "各年度均为正": { "quantifier": "all_periods", "op": "GT", "threshold": 0 }

# ── 量词归一化 ──
quantifiers:
  "累计": "sum"
  "合计": "sum"
  "总计": "sum"
  "各年": "all_periods"
  "各期": "all_periods"
  "每一年": "all_periods"
  "任一期": "any_period"
  "平均": "avg"
  "最近": "last"

# ── 窗口归一化 ──
windows:
  "最近1年": "last_1_year"
  "最近2年": "last_2_years"
  "最近3年": "last_3_years"
  "最近三个会计年度": "last_3_years"
  "最近三年": "last_3_years"
  "最近5年": "last_5_years"
  "最新一期": "latest"
  "各会计年度": "all_periods"